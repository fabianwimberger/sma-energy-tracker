<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wifiGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <filter id="pulseGlow">
      <feGaussianBlur stdDeviation="0.6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="16" cy="16" r="15" fill="#1e293b" opacity="0.95"/>

  <!-- Wi-Fi / live signal arcs -->
  <path d="M 6 19 Q 16 8 26 19" stroke="url(#wifiGradient)" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M 10 21 Q 16 14 22 21" stroke="url(#wifiGradient)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M 13.5 23 Q 16 20 18.5 23" stroke="url(#wifiGradient)" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Pulse dot -->
  <circle cx="16" cy="25" r="1.6" fill="#fef3c7" filter="url(#pulseGlow)"/>
</svg>
